[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ngimager"
version = "1.1.1"
description = "Event-cone imaging (neutron & gamma ray) with fastmode and list-mode pipelines."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MPL-2.0"}
authors = [{name="Hunter Ratliff"}]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.10",
  "h5py>=3.10",
  "tqdm>=4.66",
  "pydantic>=2.6",
  "numba>=0.59",
  "joblib>=1.4",
  "uproot",
  "tomli>=2.0; python_version<'3.11'",  # stdlib tomllib on 3.11+
  "typer>=0.12",
  "matplotlib>=3.7",
  "pandas>=2.0",
]

# Helpful metadata for PyPI
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

keywords = [
  "neutron-imaging",
  "gamma-imaging",
  "NOVO",
  "radiation-detection",
]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material[recommended]>=9.5",
  "mkdocstrings[python]>=0.24",
]
dev = [
  "pytest",
  "mkdocs>=1.6",
  "mkdocs-material[recommended]>=9.5",
  "mkdocstrings[python]>=0.24",
]

[project.scripts]
# Main imaging pipeline (Typer app)
ng-run = "ngimager.pipelines.core:app"
# Visualization CLI (already present)
ng-viz = "ngimager.cli.viz:app"
# Cone/event inspection helper
ng-inspect = "ngimager.tools.inspect_cone:main"
# Convert HDF5 output to ROOT format
ng-hdf2root = "ngimager.tools.hdf5_to_root:main"

[tool.hatch.build]
# Only include the actual package, its data, and top-level metadata.
include = [
  "src/ngimager/**",
  "README.md",
  "LICENSE",
  "pyproject.toml",
  "docs/**", 
  "examples/configs/**",
  "examples/imaging_datasets/PHITS_simple_ng_source/usrdef.out",
  "examples/imaging_datasets/PHITS_simple_ng_source/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ngimager"]

[project.urls]
Homepage = "https://github.com/lindt8/ng-imager"
Documentation = "https://lindt8.github.io/ng-imager/"
