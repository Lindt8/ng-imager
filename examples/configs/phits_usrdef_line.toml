# ====================================================================
# PHITS simple n+g source example
#
# This config drives the unified ngimager pipeline on:
#   examples/imaging_datasets/PHITS_simple_ng_source/usrdef.out
#
# It is intentionally simple and readable, and is meant to mirror
# (approximately) the legacy image_settings.txt for this dataset.
# ====================================================================

[run]
# High-level data source context
source_type = "phits"          # "cf252" | "dt" | "proton_center" | "phits"

# Which species to process
neutrons = true
gammas   = true

# Operational toggles (can also be overridden by CLI flags)
fast = false                   # use more aggressive thresholds / cone caps in [fast] config section
list = false                   # also write list-mode per-cone sparse images

# Execution / performance
workers     = 0                # 0 = auto
chunk_cones = "auto"
jit         = true
progress    = true

# Diagnostics verbosity
# 0 = off, 1 = minimal (stage summaries + counters), 2 = verbose (per-stage details)
diagnostics_level = 2

# SBP imaging engine:
#   "scan" – matrix scan across pixel-centered lines (continuous arcs)
#   "poly" – perimeter sampling (faster, but may show dotted arcs)
sbp_engine = "scan"

# Safety cap for total imaged cones (after filtering and selection)
max_cones = 50000


[pipeline]
# Where to stop the unified pipeline
# "hits" | "events" | "cones" | "image"
until = "image"


[io]
# Input PHITS usrdef tally and output HDF5 path
input_format = "phits_usrdef"       # phits_usrdef | root_novo_ddaq | hdf5_ngimager
#input_path  = "../imaging_datasets/PHITS_toy_line_source/usrdef.out"
#output_path = "../imaging_datasets/PHITS_toy_line_source/usrdef_out.h5"
input_path  = "../imaging_datasets/PHITS_toy_line_source/high_stats/usrdef.out"
output_path = "../imaging_datasets/PHITS_toy_line_source/high_stats/usrdef_out.h5"
hdf5_overwrite = true 

[io.adapter]
# PHITS usrdef adapter: stream tabular rows with normalized units
type = "phits"          # factory key for PHITSAdapter
style = "usrdef"        # make_adapter() can distinguish PHITS usrdef flavor if needed

unit_pos_is_mm = false   # positions in input are mm; convert → cm
time_units     = "ns"   # times in input are ns
require_gamma_triples = true

# NOTE: material-specific behavior (e.g. LUTs) is configured below in [detectors] and [energy].
# If the adapter needs a per-detector material, it should ask cfg.detectors.

[io.extra_text_files]
# Sometimes it is useful to carry additional text configuration or metadata
# files forward into the HDF5 output (e.g. a PHITS input deck, DAQ config
# files, or auxiliary calibration notes). You can specify these here.
# Values are file paths. If they are relative, they are interpreted relative
# to the location of the TOML config file.
# key = "path/to/text/file"
# phits_input = "phits/input/deck.inp"
# daq_config  = "daq/config/daq_settings.txt"
#phits_out = "../imaging_datasets/PHITS_toy_line_source/phits.out"
phits_out = "../imaging_datasets/PHITS_toy_line_source/high_stats/phits.out"

[detectors]
# Default material to assume if a detector ID is missing from material_map
default_material = "OGS"

# Map detector IDs to materials used in this PHITS_simple example.
# [detectors.material_map]
# 11 = "OGS"
# 12 = "OGS"
# 13 = "OGS"
# 21 = "OGS"
# 22 = "OGS"
# 23 = "OGS"

# Optional future extension (not yet required in code):
# [detectors.geometry]
# 200 = { center_cm = [-3.6, 16.5, 0.35],  normal = [0.0, -1.0, 0.0] }
# 210 = { center_cm = [-3.4, 16.8, 0.59],  normal = [0.0, -1.0, 0.0] }
# ...

[plane]
origin = [0.0, 0.0, 0.0]   # a point on the plane;  y ≈ detector face coordinate
normal = [1.0, 0.0, 0.0]    # +x
u_axis = [0.0, 0.0, 1.0]    # z runs horizontal
v_axis = [0.0, 1.0, 0.0]    # y runs vertical
u_min = -15.0
u_max =  15.0
v_min = -15.0
v_max =  15.0
du = 0.1
dv = 0.1

[filters.hits]
# Universal hit-level cuts applied before event shaping
min_light_MeVee = 0.0
max_light_MeVee = 200.0
bars_include      = []            # e.g. [200, 210, 220]
bars_exclude      = []
materials_include = []            # e.g. ["M600", "OGS"]
materials_exclude = []

[filters.hits.neutron]
# optional overrides / additions for neutron hits
# min_light_MeVee = 75.0

[filters.hits.gamma]
# optional overrides / additions for gamma hits

[filters.events]
# universal event cuts
tof_window_ns = [0.0, 30.0]

[filters.events.neutron]
# override only what you need; if empty, falls back to [filters.events]
tof_window_ns = [0.0, 30.0]
min_L1_MeVee = 0.5
min_L2_MeVee = 0.3

[filters.events.gamma]
tof_window_ns = [0.0, 30.0]
min_L_any_MeVee = 0.2

[filters.cones]
# universal cone cuts
max_delta_theta_deg = 90.0
max_incident_energy_MeV = 30.0   # global cap if desired

[filters.cones.neutron]
# max_delta_theta_deg = 3.0
# max_incident_energy_MeV = 250.0

[filters.cones.gamma]
# max_delta_theta_deg = 8.0
# max_incident_energy_MeV = 100.0

[fast]
# More aggressive light thresholds
min_L1_MeVee   = 0.8   # MeVee, first neutron scatter
min_L2_MeVee   = 0.4   # MeVee, second neutron scatter
min_L_any_MeVee = 0.2  # MeVee, any gamma or neutron deposit considered

# Stop after this many cones have been built and imaged
max_cones = 20000

# Coarsen the imaging plane by this integer factor:
# du' = du * plane_downsample, dv' = dv * plane_downsample
plane_downsample = 2

# SBP imaging engine:
#   "scan" – matrix scan across pixel-centered lines (continuous arcs)
#   "poly" – perimeter sampling (faster, but may show dotted arcs)
sbp_engine = "poly"


[energy]
# Neutron energy strategy:
# - "ELUT": use E(L) LUTs for the first scatter (per material)
# - "ToF":  use time-of-flight to estimate neutron energy change
# - "FixedEn": use a fixed incident energy (e.g. DT source)
# - "Edep": treat Hit.L as deposited energy directly (e.g. PHITS Edep_MeV)
strategy = "Edep"                 # ELUT | ToF | FixedEn | Edep

# Used only for strategy = "FixedEn"
fixed_En_MeV = 14.1

# LUT paths for any materials present. Extend freely for new materials.
lut_paths.M600.proton = "data/lut/M600/lut_M600_proton_Birks.npz"
lut_paths.M600.carbon = "data/lut/M600/lut_M600_carbon_Birks.npz"
lut_paths.OGS.proton  = "data/lut/OGS/lut_OGS_proton_Birks.npz"
lut_paths.OGS.carbon  = "data/lut/OGS/lut_OGS_carbon_Birks.npz"

[prior]
type = "line"
# type = "point"
# point = [0.0, 3.0, 4.0]
# line_p0 = [0.0, -1.0, 4.0]  # works, but old syntax
# line_p1 = [0.0,  7.0, 4.0]  # works, but old syntax
strength = 1.0

[prior.line]
p0 = [0.0, -1.0, 4.0]
p1 = [0.0,  7.0, 4.0]
# OR 
# r0        = [0.0, -1.0, 4.0]   # a point on the line
# direction = [0.0,  8.0, 0.0]   # direction vector along the line

[uncertainty]
enabled = false
smearing = "thicken"
sigma_doi_cm = 0.35
sigma_transverse_cm = 0.346
sigma_time_ns = 0.5
use_lut_bands = false  # if true, read E_lo/E_hi from LUTs where available

[vis]
export_png_on_write    = true           # render images after reconstruction
species                = ["n", "g", "all"]
center_on_plane_center = true
axis_units             = "mm"          # "cm" or "mm"
filename_pattern       = "{stem}_{species}.{ext}"
# flip_vertical          = true
# extra_formats          = ["pdf"]
# summed_dataset       = "/images/summed/n"  # advanced / legacy option

[vis.projections]
enabled      = true
roi_u_min_cm =  0.0
roi_u_max_cm =  8.0
roi_v_min_cm = -5.0
roi_v_max_cm = 10.0


# --- metrics: what to compute and write into HDF5 ---
[vis.projections.metrics]
enabled = true         # master toggle – turn metrics on/off

# u-axis metrics (e.g. transverse direction)
[vis.projections.metrics.u]
compute_summary = true   # mean, std, median, total_counts
compute_peak    = true   # argmax position + height
compute_edges   = false  # CDF-based edges along u (off by default)
edge_low_frac   = 0.2    # used if compute_edges = true
edge_high_frac  = 0.8
min_counts      = 100.0  # below this, metrics are marked *_ok = False

# v-axis metrics (e.g. beam/range direction for line sources)
[vis.projections.metrics.v]
compute_summary = true
compute_peak    = true
compute_edges   = true   # enable edges here for line/range studies
edge_low_frac   = 0.2
edge_high_frac  = 0.8
min_counts      = 100.0

# --- plotting options for vis/hdf.py (overlays, annotations) ---
[vis.projections.plot]
show_peak_markers = true
show_edge_markers = true
show_centroid_2d  = false   # future overlay on the 2D image
annotate_summary  = false   # future: small text with key metrics
show_metrics_panel = false  # future: extra panel with a table of metrics
